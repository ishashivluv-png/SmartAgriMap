<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartAgriMap</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f2;
        }

        header {
            background: #2e7d32;
            color: white;
            padding: 15px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        #map {
            width: 100%;
            height: 55vh;
        }

        .panel {
            background: white;
            margin: 10px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .panel h2 {
            margin-top: 0;
            color: #2e7d32;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            margin: 5px;
            background: #2e7d32;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .language-button {
            display: block;
            width: 100%;
            margin: 7px 0;
            text-align: left;
        }

        .selected {
            background: #1565c0;
        }

        .sensor {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .sensor-card {
            background: #eef6ec;
            padding: 10px;
            border-radius: 8px;
        }

        .alert {
            background: #fff3cd;
            border-left: 5px solid #ff9800;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
        }

        .irrigation {
            background: #ffebee;
            border-left: 5px solid #d32f2f;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
        }

        .success {
            background: #e8f5e9;
            border-left: 5px solid #2e7d32;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
        }

        #status {
            margin-top: 10px;
            font-weight: bold;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

                const marker =
                    L.marker([
                        info.latitude,
                        info.longitude
                    ]).addTo(map);

                marker.bindPopup(
                    `<b>${state}</b><br>
                     Click to view languages`
                );

                marker.on("click", () => {
                    showState(state);
                });
            }
        );
    })
    .catch(error => {
        console.error(
            "Could not load languageData.json:",
            error
        );
    });


/*
=========================================================
SHOW STATE
=========================================================
*/

function showState(state) {

    selectedState = state;

    const info = languageData[state];

    if (!info) {
        return;
    }

    let languages =
        [...info.languages]
        .sort((a, b) => b.speakers - a.speakers)
        .slice(0, 5);

    /*
    English must ALWAYS be the 6th option.
    */

    languages.push({
        name: "English",
        speakers: null
    });

    document.getElementById("stateInfo").innerHTML = `
        <h3>${state}</h3>
        <p>Select one of the top 5 languages or English.</p>
    `;

    const list =
        document.getElementById("languageList");

    list.innerHTML = "";

    languages.forEach((language, index) => {

        const button =
            document.createElement("button");

        button.className =
            "language-button";

        if (language.name === selectedLanguage) {
            button.classList.add("selected");
        }

        let text =
            `${index + 1}. ${language.name}`;

        if (language.speakers !== null) {
            text +=
                ` (${Number(language.speakers).toLocaleString()} speakers)`;
        }

        button.innerText = text;

        button.onclick = () => {

            selectLanguage(
                state,
                language.name
            );

        };

        list.appendChild(button);
    });

    document
        .getElementById("languagePanel")
        .classList.remove("hidden");

    map.setView(
        [info.latitude, info.longitude],
        7
    );

    updateDashboard();
}


/*
=========================================================
SELECT LANGUAGE
=========================================================
*/

async function selectLanguage(
    state,
    language
) {

    selectedState = state;
    selectedLanguage = language;

    localStorage.setItem(
        "selectedState",
        state
    );

    localStorage.setItem(
        "selectedLanguage",
        language
    );

    showState(state);

    if (!BACKEND_URL || !chatId) {

        document.getElementById("status").innerText =
            "Language selected: " + language;

        return;
    }

    try {

        const response =
            await fetch(
                `${BACKEND_URL}/api/select`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        state: state,
                        language: language
                    })
                }
            );

        const result =
            await response.json();

        document.getElementById("status").innerText =
            result.message ||
            "Language selected successfully.";

        updateDashboard();

    } catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "Could not connect to SmartAgriMap server.";
    }
}


/*
=========================================================
DASHBOARD
=========================================================
*/

async function updateDashboard() {

    if (!BACKEND_URL || !chatId) {
        return;
    }

    try {

        const response =
            await fetch(
                `${BACKEND_URL}/api/dashboard?chat_id=${encodeURIComponent(chatId)}`
            );

        const data =
            await response.json();

        if (!data.success) {
            return;
        }

        const sensor =
            data.sensor;

        document.getElementById("soil").innerText =
            sensor.soil_moisture ?? "--";

        document.getElementById("temperature").innerText =
            sensor.temperature ?? "--";

        document.getElementById("humidity").innerText =
            sensor.humidity ?? "--";

        document.getElementById("water").innerText =
            sensor.water_level ?? "--";

        document.getElementById("pump").innerText =
            sensor.pump ? "ON" : "OFF";

        document.getElementById("rain").innerText =
            data.rain_probability ?? "--";

        updateAlert(data);

    } catch (error) {

        console.error(
            "Dashboard error:",
            error
        );
    }
}


/*
=========================================================
ALERT
=========================================================
*/

function updateAlert(data) {

    const box =
        document.getElementById("alertBox");

    const approve =
        document.getElementById("approveButton");

    const t =
        translations[selectedLanguage] ||
        translations["English"];

    box.innerHTML = "";

    /*
    Soil moisture below 70%
    */

    if (
        data.sensor &&
        Number(data.sensor.soil_moisture) < 70
    ) {

        const irrigation =
            document.createElement("div");

        irrigation.className =
            "irrigation";

        irrigation.innerText =
            t.irrigation;

        box.appendChild(irrigation);

        approve.innerText =
            t.approve;

        approve.classList.remove("hidden");

    } else {

        approve.classList.add("hidden");

        const success =
            document.createElement("div");

        success.className =
            "success";

        success.innerText =
            "Soil moisture is sufficient.";

        box.appendChild(success);
    }

    /*
    Rain >= 50%
    */

    if (
        data.rain_probability !== null &&
        Number(data.rain_probability) >= 50
    ) {

        const rain =
            document.createElement("div");

        rain.className =
            "alert";

        rain.innerText =
            t.rainPostpone;

        box.appendChild(rain);
    }
}


/*
=========================================================
APPROVE IRRIGATION
=========================================================
*/

async function approveIrrigation() {

    if (!BACKEND_URL || !chatId) {

        document.getElementById("status").innerText =
            "Backend connection is not configured.";

        return;
    }

    try {

        const response =
            await fetch(
                `${BACKEND_URL}/api/approve`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        chat_id: chatId
                    })
                }
            );

        const result =
            await response.json();

        document.getElementById("status").innerText =
            result.message ||
            "Irrigation command sent.";

        updateDashboard();

    } catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "Could not send irrigation command.";
    }
}


/*
=========================================================
LOAD SAVED SELECTION
=========================================================
*/

const savedState =
    localStorage.getItem("selectedState");

const savedLanguage =
    localStorage.getItem("selectedLanguage");

if (savedLanguage) {
    selectedLanguage = savedLanguage;
}

if (
    savedState &&
    languageData[savedState]
) {

    showState(savedState);
}


/*
=========================================================
REFRESH SENSOR DATA
=========================================================
*/

setInterval(
    updateDashboard,
    5000
);

</script>
