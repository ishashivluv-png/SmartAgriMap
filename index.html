<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartAgriMap</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f4;
        }

        header {
            background: #198754;
            color: white;
            padding: 18px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 6px 0 0;
            font-size: 15px;
        }

        .main-container {
            display: flex;
            height: calc(100vh - 95px);
        }

        #map {
            flex: 1;
            min-height: 500px;
        }

        .side-panel {
            width: 390px;
            background: white;
            padding: 20px;
            overflow-y: auto;
            box-shadow: -2px 0 8px rgba(0,0,0,0.15);
        }

        .side-panel h2 {
            margin-top: 0;
            color: #198754;
        }

        .state-name {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .coordinates {
            color: #666;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .section-title {
            margin-top: 20px;
            margin-bottom: 8px;
        }

        .language-button {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: 1px solid #198754;
            background: white;
            color: #198754;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
        }

        .language-button:hover {
            background: #e8f5e9;
        }

        .language-button.selected {
            background: #198754;
            color: white;
        }

        .speaker-count {
            float: right;
            font-weight: bold;
        }

        .default-text {
            font-size: 12px;
            font-weight: bold;
            margin-left: 5px;
        }

        .alert-box {
            margin-top: 25px;
            padding: 16px;
            border-radius: 10px;
            background: #fff3cd;
            border: 1px solid #ffc107;
        }

        .alert-box h3 {
            margin-top: 0;
            color: #856404;
        }

        #alertMessage {
            font-size: 17px;
            line-height: 1.5;
            font-weight: bold;
        }

        .voice-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .voice-button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .listen {
            background: #198754;
            color: white;
        }

        .stop {
            background: #dc3545;
            color: white;
        }

        .instruction {
            margin-top: 20px;
            padding: 12px;
            background: #eef7ff;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .selected-language {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
        }

        @media (max-width: 800px) {

            .main-container {
                flex-direction: column;
                height: auto;
            }

            #map {
                height: 500px;
            }

            .side-panel {
                width: 100%;
            }

        }

    </style>

</head>


<body>

<header>

    <h1>🌱 SmartAgriMap</h1>

    <p>
        State-wise Language & Speaker Map of India
    </p>

</header>


<div class="main-container">

    <div id="map"></div>

    <div class="side-panel">

        <h2>📍 State Information</h2>

        <div id="stateInfo">

            <p>
                Click a state marker to view information.
            </p>

        </div>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://telegram.org/js/telegram-web-app.js"></script>


<script>

    // =====================================================
    // TELEGRAM
    // =====================================================

    if (window.Telegram && Telegram.WebApp) {

        Telegram.WebApp.ready();

        Telegram.WebApp.expand();

    }


    // =====================================================
    // MAP
    // =====================================================

    const map = L.map("map").setView(
        [22.5, 80],
        5
    );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


    // =====================================================
    // VARIABLES
    // =====================================================

    let languageData = {};

    let selectedState = null;

    let selectedLanguage = "English";


    // =====================================================
    // IRRIGATION MESSAGE
    // =====================================================

    const irrigationMessages = {

        English:
            "Irrigation is needed. Please approve irrigation.",

        Hindi:
            "सिंचाई की आवश्यकता है। कृपया सिंचाई की अनुमति दें।",

        Tamil:
            "பாசனம் தேவைப்படுகிறது. தயவுசெய்து பாசனத்தை அனுமதிக்கவும்.",

        Telugu:
            "నీటిపారుదల అవసరం ఉంది. దయచేసి నీటిపారుదలను ఆమోదించండి.",

        Kannada:
            "ನೀರಾವರಿ ಅಗತ್ಯವಿದೆ. ದಯವಿಟ್ಟು ನೀರಾವರಿಯನ್ನು ಅನುಮೋದಿಸಿ.",

        Malayalam:
            "ജലസേചനം ആവശ്യമാണ്. ദയവായി ജലസേചനം അംഗീകരിക്കുക.",

        Urdu:
            "آبپاشی کی ضرورت ہے۔ براہ کرم آبپاشی کی منظوری دیں۔",

        Bengali:
            "সেচের প্রয়োজন রয়েছে। দয়া করে সেচের অনুমতি দিন।",

        Marathi:
            "सिंचनाची गरज आहे. कृपया सिंचनास मंजुरी द्या.",

        Gujarati:
            "સિંચાઈની જરૂર છે. કૃપા કરીને સિંચાઈને મંજૂરી આપો.",

        Punjabi:
            "ਸਿੰਚਾਈ ਦੀ ਲੋੜ ਹੈ। ਕਿਰਪਾ ਕਰਕੇ ਸਿੰਚਾਈ ਨੂੰ ਮਨਜ਼ੂਰੀ ਦਿਓ।",

        Odia:
            "ଜଳସେଚନ ଆବଶ୍ୟକ। ଦୟାକରି ଜଳସେଚନକୁ ଅନୁମୋଦନ କରନ୍ତୁ।",

        Assamese:
            "জলসিঞ্চনৰ প্ৰয়োজন আছে। অনুগ্ৰহ কৰি জলসিঞ্চনৰ অনুমতি দিয়ক।"

    };


    // =====================================================
    // LANGUAGE CODES FOR TEXT TO SPEECH
    // =====================================================

    const languageCodes = {

        English: "en-IN",

        Hindi: "hi-IN",

        Tamil: "ta-IN",

        Telugu: "te-IN",

        Kannada: "kn-IN",

        Malayalam: "ml-IN",

        Urdu: "ur-IN",

        Bengali: "bn-IN",

        Marathi: "mr-IN",

        Gujarati: "gu-IN",

        Punjabi: "pa-IN",

        Odia: "or-IN",

        Assamese: "as-IN"

    };


    // =====================================================
    // LOAD LANGUAGE DATA
    // =====================================================

    fetch("languageData.json")

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "languageData.json could not be loaded"
                );

            }

            return response.json();

        })

        .then(data => {

            languageData = data;

            createStateMarkers();

            openStateFromURL();

        })

        .catch(error => {

            console.error(error);

            document.getElementById(
                "stateInfo"
            ).innerHTML = `

                <p style="color:red;">
                    Error loading languageData.json
                </p>

            `;

        });


    // =====================================================
    // CREATE STATE MARKERS
    // =====================================================

    function createStateMarkers() {

        Object.keys(languageData).forEach(state => {

            const data = languageData[state];

            if (
                data.latitude === undefined ||
                data.longitude === undefined
            ) {
                return;
            }

            const marker = L.marker([
                data.latitude,
                data.longitude
            ]).addTo(map);

            marker.bindTooltip(state);

            marker.on("click", function() {

                showState(state);

            });

        });

    }


    // =====================================================
    // SHOW STATE
    // =====================================================

    function showState(state) {

        selectedState = state;

        // English is always the default
        selectedLanguage = "English";


        const data = languageData[state];

        if (!data) {
            return;
        }


        // =================================================
        // SORT LANGUAGES
        // =================================================

        const topLanguages =
            [...data.languages]
            .sort((a, b) => {

                return getSpeakerCount(b)
                     - getSpeakerCount(a);

            })
            .slice(0, 5);


        // =================================================
        // BUILD HTML
        // =================================================

        let html = `

            <div class="state-name">
                ${state}
            </div>

            <div class="coordinates">

                Latitude:
                ${data.latitude}

                <br>

                Longitude:
                ${data.longitude}

            </div>


            <h3 class="section-title">
                🌐 Select Language
            </h3>


            <!-- ENGLISH -->

            <button
                id="englishButton"
                class="language-button selected"
                onclick="selectLanguage('English')"
            >

                🇬🇧 <strong>English</strong>

                <span class="default-text">
                    (Default)
                </span>

            </button>


            <h3 class="section-title">
                🗣️ Top 5 Languages
            </h3>

        `;


        // =================================================
        // TOP 5 LANGUAGE BUTTONS
        // =================================================

        topLanguages.forEach((item, index) => {

            const language =
                getLanguageName(item);

            const speakers =
                getSpeakerCount(item);


            html += `

                <button
                    class="language-button"
                    data-language="${escapeHTML(language)}"
                    onclick="selectLanguageFromButton(this)"
                >

                    <strong>
                        ${index + 1}.
                        ${language}
                    </strong>

                    <span class="speaker-count">

                        ${formatNumber(speakers)}

                    </span>

                </button>

            `;

        });


        // =================================================
        // ALERT
        // =================================================

        html += `

            <div class="selected-language">

                Selected language:
                <strong id="selectedLanguageText">
                    English
                </strong>

            </div>


            <div class="alert-box">

                <h3>
                    🚜 Irrigation Alert
                </h3>

                <p id="alertMessage">

                    ${getMessage("English")}

                </p>


                <div class="voice-buttons">

                    <button
                        class="voice-button listen"
                        onclick="speakAlert()"
                    >
                        🔊 Listen
                    </button>

                    <button
                        class="voice-button stop"
                        onclick="stopSpeech()"
                    >
                        ⏹ Stop
                    </button>

                </div>

            </div>


            <div class="instruction">

                <strong>How it works:</strong>

                <br><br>

                🇬🇧 English is always available.

                <br>

                🗣️ The state's Top 5 languages
                are shown below English.

                <br>

                👆 Select any language.

                <br>

                🔊 Press Listen to hear the alert.

            </div>

        `;


        document.getElementById(
            "stateInfo"
        ).innerHTML = html;


        // Move map

        map.setView(
            [
                data.latitude,
                data.longitude
            ],
            7
        );

    }


    // =====================================================
    // SELECT LANGUAGE FROM BUTTON
    // =====================================================

    function selectLanguageFromButton(button) {

        const language =
            button.getAttribute(
                "data-language"
            );

        selectLanguage(language);

    }


    // =====================================================
    // SELECT LANGUAGE
    // =====================================================

    function selectLanguage(language) {

        selectedLanguage = language;


        // Change selected button

        document
            .querySelectorAll(
                ".language-button"
            )
            .forEach(button => {

                button.classList.remove(
                    "selected"
                );

            });


        if (language === "English") {

            const button =
                document.getElementById(
                    "englishButton"
                );

            if (button) {

                button.classList.add(
                    "selected"
                );

            }

        }
        else {

            document
                .querySelectorAll(
                    ".language-button"
                )
                .forEach(button => {

                    if (
                        button.getAttribute(
                            "data-language"
                        ) === language
                    ) {

                        button.classList.add(
                            "selected"
                        );

                    }

                });

        }


        // Update selected language text

        const selectedText =
            document.getElementById(
                "selectedLanguageText"
            );

        if (selectedText) {

            selectedText.textContent =
                language;

        }


        // Update alert

        const alertMessage =
            document.getElementById(
                "alertMessage"
            );

        if (alertMessage) {

            alertMessage.textContent =
                getMessage(language);

        }

    }


    // =====================================================
    // GET MESSAGE
    // =====================================================

    function getMessage(language) {

        /*
         * If we have a translation,
         * use it.
         *
         * If not, English is used as a
         * safe fallback.
         */

        return (
            irrigationMessages[language] ||
            irrigationMessages["English"]
        );

    }


    // =====================================================
    // TEXT TO SPEECH
    // =====================================================

    function speakAlert() {

        const language =
            selectedLanguage || "English";


        const message =
            getMessage(language);


        const languageCode =
            languageCodes[language];


        if (!languageCode) {

            alert(
                "Audio for " +
                language +
                " has not been configured yet."
            );

            return;

        }


        // Stop existing speech

        window.speechSynthesis.cancel();


        // Get voices

        let voices =
            window.speechSynthesis.getVoices();


        // Find exact voice

        let voice =
            voices.find(v =>

                v.lang.toLowerCase() ===
                languageCode.toLowerCase()

            );


        // Find same-language voice

        if (!voice) {

            const shortCode =
                languageCode
                .split("-")[0]
                .toLowerCase();


            voice =
                voices.find(v =>

                    v.lang
                    .toLowerCase()
                    .startsWith(shortCode)

                );

        }


        // IMPORTANT:
        // Do NOT silently use English
        // for another language.

        if (
            language !== "English" &&
            !voice
        ) {

            alert(

                "A " +
                language +
                " voice is not available on this device.\n\n" +

                "Please install the " +
                language +
                " Text-to-Speech voice on your phone."

            );

            return;

        }


        // Create speech

        const speech =
            new SpeechSynthesisUtterance(
                message
            );


        if (voice) {

            speech.voice =
                voice;

            speech.lang =
                voice.lang;

        }
        else {

            speech.lang =
                "en-IN";

        }


        speech.rate = 0.9;

        speech.pitch = 1;


        window.speechSynthesis.speak(
            speech
        );

    }


    // =====================================================
    // STOP AUDIO
    // =====================================================

    function stopSpeech() {

        window.speechSynthesis.cancel();

    }


    // =====================================================
    // GET LANGUAGE NAME
    // =====================================================

    function getLanguageName(item) {

        if (
            typeof item === "string"
        ) {

            return item;

        }


        return (

            item.language ||
            item.name ||
            item.Language ||
            "Unknown"

        );

    }


    // =====================================================
    // GET SPEAKER COUNT
    // =====================================================

    function getSpeakerCount(item) {

        if (
            typeof item === "string"
        ) {

            return 0;

        }


        const values = [

            item.speakers,

            item.Speakers,

            item.speaker_count,

            item["Speaker Count"],

            item.count,

            item.Count

        ];


        for (
            const value of values
        ) {

            if (
                value !== undefined &&
                value !== null
            ) {

                const number =
                    Number(
                        String(value)
                        .replace(/,/g, "")
                    );


                if (!isNaN(number)) {

                    return number;

                }

            }

        }


        return 0;

    }


    // =====================================================
    // FORMAT NUMBER
    // =====================================================

    function formatNumber(number) {

        if (
            number === undefined ||
            number === null ||
            isNaN(number)
        ) {

            return "N/A";

        }


        return Number(number)
            .toLocaleString("en-IN");

    }


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHTML(text) {

        return String(text)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    // =====================================================
    // URL PARAMETERS
    // =====================================================

    function openStateFromURL() {

        const params =
            new URLSearchParams(
                window.location.search
            );


        const state =
            params.get("state");


        const lat =
            parseFloat(
                params.get("lat")
            );


        const lng =
            parseFloat(
                params.get("lng")
            );


        // Farmer location

        if (
            !isNaN(lat) &&
            !isNaN(lng)
        ) {

            map.setView(
                [lat, lng],
                12
            );


            L.marker([
                lat,
                lng
            ])
            .addTo(map)
            .bindPopup(
                "🚜 Farmer's Location"
            )
            .openPopup();

        }


        // State

        if (
            state &&
            languageData[state]
        ) {

            showState(state);

        }

    }

</script>

</body>

</html>
