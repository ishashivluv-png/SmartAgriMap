<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartAgriMap</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f4;
        }

        header {
            background: #198754;
            color: white;
            padding: 18px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 6px 0 0;
            font-size: 15px;
        }

        .main-container {
            display: flex;
            height: calc(100vh - 95px);
        }

        #map {
            flex: 1;
            min-height: 500px;
        }

        .side-panel {
            width: 380px;
            background: white;
            padding: 20px;
            overflow-y: auto;
            box-shadow: -2px 0 8px rgba(0,0,0,0.15);
        }

        .side-panel h2 {
            margin-top: 0;
            color: #198754;
        }

        .state-name {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .coordinates {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .language-list {
            margin-top: 10px;
        }

        .language-button {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: 1px solid #198754;
            background: white;
            color: #198754;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
        }

        .language-button:hover {
            background: #e8f5e9;
        }

        .language-button.selected {
            background: #198754;
            color: white;
        }

        .speaker-count {
            float: right;
            font-weight: bold;
        }

        .alert-box {
            margin-top: 25px;
            padding: 16px;
            border-radius: 10px;
            background: #fff3cd;
            border: 1px solid #ffc107;
        }

        .alert-box h3 {
            margin-top: 0;
            color: #856404;
        }

        #alertMessage {
            font-size: 17px;
            line-height: 1.5;
            font-weight: bold;
        }

        .voice-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .voice-button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .listen {
            background: #198754;
            color: white;
        }

        .stop {
            background: #dc3545;
            color: white;
        }

        .instruction {
            margin-top: 20px;
            padding: 12px;
            background: #eef7ff;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
        }

        @media (max-width: 800px) {
            .main-container {
                flex-direction: column;
                height: auto;
            }

            #map {
                height: 500px;
            }

            .side-panel {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🌱 SmartAgriMap</h1>
    <p>State-wise Language & Speaker Map of India</p>
</header>

<div class="main-container">

    <!-- MAP -->
    <div id="map"></div>

    <!-- INFORMATION PANEL -->
    <div class="side-panel">

        <h2>📍 State Information</h2>

        <div id="stateInfo">
            <p>Click on a state marker to view information.</p>
        </div>

    </div>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Telegram Web App support for later -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

    // ----------------------------------------------------
    // TELEGRAM WEB APP INITIALIZATION
    // ----------------------------------------------------

    if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    }


    // ----------------------------------------------------
    // CREATE MAP
    // ----------------------------------------------------

    const map = L.map('map').setView([22.5, 80], 5);

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);


    // ----------------------------------------------------
    // VARIABLES
    // ----------------------------------------------------

    let languageData = {};

    let selectedState = null;
    let selectedLanguage = null;

    let farmerMarker = null;


    // ----------------------------------------------------
    // IRRIGATION ALERT TRANSLATIONS
    // ----------------------------------------------------

    const alertMessages = {

        "English":
            "Irrigation is needed. Please approve irrigation.",

        "Tamil":
            "பாசனம் தேவைப்படுகிறது. தயவுசெய்து பாசனத்தை அனுமதிக்கவும்.",

        "Telugu":
            "నీటిపారుదల అవసరం ఉంది. దయచేసి నీటిపారుదలను ఆమోదించండి.",

        "Kannada":
            "ನೀರಾವರಿ ಅಗತ್ಯವಿದೆ. ದಯವಿಟ್ಟು ನೀರಾವರಿಯನ್ನು ಅನುಮೋದಿಸಿ.",

        "Malayalam":
            "ജലസേചനം ആവശ്യമാണ്. ദയവായി ജലസേചനം അംഗീകരിക്കുക.",

        "Urdu":
            "آبپاشی کی ضرورت ہے۔ براہ کرم آبپاشی کی منظوری دیں."
    };


    // ----------------------------------------------------
    // LANGUAGE CODES FOR TEXT-TO-SPEECH
    // ----------------------------------------------------

    const languageCodes = {

        "English": "en-IN",

        "Tamil": "ta-IN",

        "Telugu": "te-IN",

        "Kannada": "kn-IN",

        "Malayalam": "ml-IN",

        "Urdu": "ur-IN"
    };


    // ----------------------------------------------------
    // LOAD JSON DATA
    // ----------------------------------------------------

    fetch("languageData.json")

        .then(response => {

            if (!response.ok) {
                throw new Error("Could not load languageData.json");
            }

            return response.json();

        })

        .then(data => {

            languageData = data;

            createStateMarkers();

            openStateFromURL();

        })

        .catch(error => {

            console.error(error);

            document.getElementById("stateInfo").innerHTML = `
                <p style="color:red;">
                    Error loading languageData.json
                </p>
            `;

        });


    // ----------------------------------------------------
    // CREATE STATE MARKERS
    // ----------------------------------------------------

    function createStateMarkers() {

        Object.keys(languageData).forEach(state => {

            const stateData = languageData[state];

            if (
                stateData.latitude === undefined ||
                stateData.longitude === undefined
            ) {
                return;
            }


            const marker = L.marker([
                stateData.latitude,
                stateData.longitude
            ]).addTo(map);


            marker.bindTooltip(state);


            marker.on("click", function() {

                showState(state);

            });

        });

    }


    // ----------------------------------------------------
    // SHOW STATE INFORMATION
    // ----------------------------------------------------

    function showState(state) {

        selectedState = state;
        selectedLanguage = null;

        const data = languageData[state];

        if (!data) {
            return;
        }


        // Sort languages according to speaker count

        const topLanguages = [...data.languages]
            .sort((a, b) => {

                const countA = getSpeakerCount(a);
                const countB = getSpeakerCount(b);

                return countB - countA;

            })
            .slice(0, 5);


        let html = `

            <div class="state-name">
                ${state}
            </div>

            <div class="coordinates">
                Latitude: ${data.latitude}<br>
                Longitude: ${data.longitude}
            </div>

            <h3>🗣️ Top 5 Languages</h3>

            <div class="language-list">
        `;


        // Create language buttons

        topLanguages.forEach((item, index) => {

            const languageName = getLanguageName(item);
            const speakerCount = getSpeakerCount(item);


            html += `

                <button
                    class="language-button"
                    id="language-${index}"
                    onclick="selectLanguage('${escapeQuotes(languageName)}')"
                >

                    <strong>${index + 1}. ${languageName}</strong>

                    <span class="speaker-count">
                        ${formatNumber(speakerCount)}
                    </span>

                </button>

            `;

        });


        html += `

            </div>

            <div class="alert-box">

                <h3>🚜 Irrigation Alert</h3>

                <p id="alertMessage">
                    Please select a language.
                </p>

                <div class="voice-buttons">

                    <button
                        class="voice-button listen"
                        onclick="speakAlert()"
                    >
                        🔊 Listen
                    </button>

                    <button
                        class="voice-button stop"
                        onclick="stopSpeech()"
                    >
                        ⏹ Stop
                    </button>

                </div>

            </div>

            <div class="instruction">

                <strong>How it works:</strong><br><br>

                1. Select your language.<br>
                2. The irrigation alert changes to that language.<br>
                3. Press 🔊 Listen to hear the alert.

            </div>

        `;


        document.getElementById("stateInfo").innerHTML = html;


        // Move map to selected state

        map.setView(
            [data.latitude, data.longitude],
            7
        );

    }


    // ----------------------------------------------------
    // SELECT LANGUAGE
    // ----------------------------------------------------

    function selectLanguage(language) {

        selectedLanguage = language;


        // Update alert message

        const message =
            alertMessages[language] ||
            alertMessages["English"];


        const alertElement =
            document.getElementById("alertMessage");


        if (alertElement) {

            alertElement.textContent = message;

        }


        // Remove previous selection

        document
            .querySelectorAll(".language-button")
            .forEach(button => {

                button.classList.remove("selected");

            });


        // Find clicked language button

        document
            .querySelectorAll(".language-button")
            .forEach(button => {

                if (
                    button.textContent
                        .trim()
                        .startsWith(language)
                ) {

                    button.classList.add("selected");

                }

            });

    }


    // ----------------------------------------------------
    // TEXT TO SPEECH
    // ----------------------------------------------------

    function speakAlert() {

        if (!selectedLanguage) {

            alert("Please select a language first.");

            return;

        }


        const message =
            alertMessages[selectedLanguage] ||
            alertMessages["English"];


        // Stop previous speech

        window.speechSynthesis.cancel();


        const speech =
            new SpeechSynthesisUtterance(message);


        speech.lang =
            languageCodes[selectedLanguage] ||
            "en-IN";


        speech.rate = 0.9;

        speech.pitch = 1;


        window.speechSynthesis.speak(speech);

    }


    // ----------------------------------------------------
    // STOP SPEECH
    // ----------------------------------------------------

    function stopSpeech() {

        window.speechSynthesis.cancel();

    }


    // ----------------------------------------------------
    // GET LANGUAGE NAME
    // ----------------------------------------------------

    function getLanguageName(item) {

        if (typeof item === "string") {
            return item;
        }

        return (
            item.language ||
            item.name ||
            item.Language ||
            "Unknown"
        );

    }


    // ----------------------------------------------------
    // GET SPEAKER COUNT
    // ----------------------------------------------------

    function getSpeakerCount(item) {

        if (typeof item === "string") {
            return 0;
        }


        const possibleValues = [

            item.speakers,
            item.Speakers,
            item.speaker_count,
            item["Speaker Count"],
            item.count,
            item.Count

        ];


        for (const value of possibleValues) {

            if (value !== undefined && value !== null) {

                const number =
                    Number(
                        String(value)
                            .replace(/,/g, "")
                    );

                if (!isNaN(number)) {
                    return number;
                }

            }

        }


        return 0;

    }


    // ----------------------------------------------------
    // FORMAT NUMBERS
    // ----------------------------------------------------

    function formatNumber(number) {

        if (!number || isNaN(number)) {
            return "N/A";
        }

        return Number(number).toLocaleString("en-IN");

    }


    // ----------------------------------------------------
    // ESCAPE QUOTES
    // ----------------------------------------------------

    function escapeQuotes(text) {

        return String(text)
            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'");

    }


    // ----------------------------------------------------
    // OPEN STATE FROM URL
    // ----------------------------------------------------
    //
    // Later Telegram can open:
    //
    // index.html?state=Tamil%20Nadu&lat=8.7&lng=77.7
    //
    // This will allow us to open the map
    // at a particular farmer's location.
    //

    function openStateFromURL() {

        const params =
            new URLSearchParams(window.location.search);


        const state =
            params.get("state");

        const lat =
            parseFloat(params.get("lat"));

        const lng =
            parseFloat(params.get("lng"));


        // If farmer location is provided

        if (
            !isNaN(lat) &&
            !isNaN(lng)
        ) {

            map.setView(
                [lat, lng],
                12
            );


            farmerMarker =
                L.marker([lat, lng])
                    .addTo(map)
                    .bindPopup(
                        "🚜 Farmer's Location"
                    )
                    .openPopup();

        }


        // If state is provided

        if (
            state &&
            languageData[state]
        ) {

            showState(state);

        }

    }

</script>

</body>
</html>
